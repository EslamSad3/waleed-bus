name: CI

# Gate every PR targeting main with the full test suite, then run the exact
# same suite again on every push to main (i.e. after merge).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: typecheck · lint · unit + e2e (coverage) · build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI uses the service container instead of the embedded test cluster.
      TEST_USE_EMBEDDED: '0'
      TEST_DATABASE_URL: postgresql://app_tenant:app_tenant_pw@localhost:5432/bus_test
      TEST_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/bus_test

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Runs unit + e2e suites together and enforces the coverage thresholds.
      # The e2e global setup provisions the app_tenant role, migrations, and
      # RLS policies against the service container on localhost:5432.
      - name: Test (unit + e2e with coverage gate)
        run: pnpm test:cov

      - name: Build
        run: pnpm build
